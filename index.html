  h+='<div class="row"><section class="side" style="flex:1 1 380px"><div class="card stack" style="gap:12px"><div class="small muted">Genel alıcı hazırlık skoru</div><div><span class="disp" style="font-weight:700;font-size:64px;line-height:1;color:#8A4B0F">'+score+'</span> <span class="muted" style="font-size:18px">/ 100</span></div><span class="bar" style="height:12px"><span style="width:'+score+'%"></span></span><p style="margin:0;font-size:14px;line-height:1.5;color:#4A3D2F">'+(score>=85?'Büyük alıcıların çoğunun tedarikçi onay sürecine girmeye hazırsınız.':'Onay sürecine girebilirsiniz, ama sağdaki eksikler alıcıların elemesinde en sık takılan noktalar.')+'</p></div>';
  h+='<div class="card stack" style="gap:14px"><h2 style="font-size:16px">Alıcı tipine göre hazırlık</h2>'+['Küresel tat ve bileşen şirketi','AB market zinciri (özel marka)','Avrupalı çikolata üreticisi'].map(function(n,i){var x=Math.min(bs[i],100);return '<div><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>'+n+'</span><b>'+x+'</b></div><span class="bar" style="height:8px"><span style="width:'+x+'%"></span></span></div>'}).join('')+'</div></section>';
  h+='<section class="card main stack"><div><h1 class="disp" style="font-size:28px">Skoru yükseltmek için</h1><p class="muted" style="margin:6px 0 0">Eksikler, alıcıların en sık sorduğu konulara göre sıralandı. Tamamladıkça skor güncellenir.</p></div>';
  h+=GAPS.map(function(g){var on=!!k.done[g.id];return '<div style="border:1px solid '+(on?'#B8DCCD':'#E6DED3')+';background:'+(on?'#F1F8F4':'#fff')+';border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px"><div style="flex:1 1 300px;min-width:0"><div style="font-weight:700;font-size:16px">'+g.title+'</div><div style="font-size:14px;color:#4A3D2F;margin-top:4px;line-height:1.5">'+g.why+'</div><div class="small muted" style="margin-top:6px">Tahmini süre: '+g.effort+' · Kökpas desteği: '+g.help+'</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="disp" style="font-weight:700;color:#8A4B0F">+'+g.pts+' puan</span><button type="button" class="'+(on?'btn':'btn ghost')+'" style="'+(on?'background:#0F6B5C':'color:#8A4B0F;border-color:#8A4B0F')+';font-size:13px" aria-pressed="'+on+'" data-a="kdone" data-v="'+g.id+'">'+(on?'Tamamlandı':'Tamamlandı say')+'</button></div></div>'}).join('');
  h+='</section></div>';
 }
 if(k.tab===1){
  var D=[['FSSC 22000 sertifikası','Gıda güvenliği','ok','Geçerli','Mart 2027','3/3'],['Helal sertifikası','Tüm ürünler','ok','Geçerli','Ağustos 2027','2/3'],['Alerjen beyan formu','Tüm ürünler','ok','Geçerli','–','3/3'],['Analiz sertifikası şablonu (COA)','Lot bazında','warn','Süresi yaklaşıyor','Ocak 2027','3/3'],['Aflatoksin analiz raporu','Fındık lotları','warn','Süresi yaklaşıyor','Aralık 2026','3/3'],['SMETA sosyal denetim','Tesis ve bahçeler','plan','Planlandı','–','2/3'],['Karbon ayak izi raporu','Ton ürün başı','miss','Eksik','–','2/3'],['Tedarikçi davranış kuralları onayı','Alıcıya özel','ok','İmzalı','–','1/3']];
  var FM={'Tümü':null,'Geçerli':['ok'],'Süresi yaklaşan':['warn'],'Eksik veya planlı':['miss','plan']},al=FM[k.filter];
  h+='<section class="card stack"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end"><div><h1 class="disp" style="font-size:28px">Belge kasası</h1><p class="muted" style="margin:6px 0 0">Süresi yaklaşan belgeler için 60 gün önceden uyarı gelir.</p></div><button type="button" class="btn">+ Belge yükle</button></div>'+pills(Object.keys(FM),k.filter,'kfilter');
  h+=table(['Belge','Kapsam','Durum','Geçerlilik','Kaç alıcı istiyor'],D.filter(function(d){return !al||al.indexOf(d[2])>=0}).map(function(d){return ['<b>'+d[0]+'</b>',d[1],chip(d[2],d[3]),d[4],d[5]]}))+'</section>';
 }
 if(k.tab===2){
  var gpsDone=!!k.done.gps,ddsDone=!!k.done.dds;
  h+='<div class="stack">'+kpis([['Kayıtlı fındık bahçesi','214','Ordu ve Giresun'],['GPS kaydı tamam',gpsDone?'214':'168',gpsDone?'%100':'%79'],['Sezonluk işçi kaydı','1.020 kişi','2026 hasadı'],['DDS referanslı kakao lotu',ddsDone?'3 / 3':'1 / 3','AB satışları için']]);
  var farms=[['FB-0112','Ünye','ok','ok'],['FB-0113','Ünye','ok','ok'],['FB-0187','Fatsa','miss','ok'],['FB-0201','Bulancak','ok','warn'],['FB-0209','Bulancak','miss','warn']];
  var lots=[['KK-26-031','Kakao tozu · Batı Afrika kaynaklı, ithalatçı üzerinden','ok'],['KK-26-034','Kakao kitlesi · Latin Amerika kaynaklı','miss'],['KK-26-040','Kakao tozu · Batı Afrika kaynaklı','miss']];
  h+='<div class="row"><div class="card stack" style="flex:1 1 520px;min-width:0;gap:12px"><h2 style="font-size:18px">Fındık bahçeleri</h2><p style="margin:0;font-size:14px;line-height:1.5;color:#4A3D2F">Fındık EUDR kapsamında değil; ancak büyük alıcılar bahçe düzeyinde izlenebilirlik ve sezonluk işçi koşulları için durum tespiti istiyor.</p>'+table(['Bahçe','İlçe','GPS','İşçi kaydı'],farms.map(function(f){var g=gpsDone?'ok':f[2];return ['<code>'+f[0]+'</code>',f[1],chip(g,g==='ok'?'Kayıtlı':'Eksik'),chip(f[3],f[3]==='ok'?'Tam':'Kısmi')]}),440)+'</div>';
  h+='<div class="card stack" style="flex:1 1 420px;min-width:0;gap:12px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="font-size:18px">Kakao girdileri</h2>'+chip('warn','EUDR kapsamında')+'</div><p style="margin:0;font-size:14px;line-height:1.5;color:#4A3D2F">Kakaolu fındık ezmesi AB\'ye satıldığında, kakao tedarikçisinin durum tespiti beyanı (DDS) referansı her lotta tutulmalı. Büyük operatörler için başlangıç: 30 Aralık 2026.</p>'+lots.map(function(l){var s=ddsDone?'ok':l[2];return '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border:1px solid #E6DED3;border-radius:10px;padding:12px 14px;font-size:14px"><div><code style="font-weight:600">'+l[0]+'</code><div class="small muted">'+l[1]+'</div></div>'+chip(s,s==='ok'?'DDS referansı var':'Referans bekleniyor')+'</div>'}).join('')+'</div></div></div>';
 }
 if(k.tab===3){
  var R=[['r1','Küresel tat ve bileşen şirketi','Tedarikçi onay anketi',86,'2 Ara',81],['r2','AB market zinciri (özel marka)','Sosyal uygunluk ve izlenebilirlik',54,'10 Ara',74],['r3','Avrupalı çikolata üreticisi','EUDR ve karbon veri talebi',32,'18 Ara',63]];
  h+='<section class="card stack"><div><h1 class="disp" style="font-size:28px">Alıcı talepleri</h1><p class="muted" style="margin:6px 0 0">Gelen tedarikçi anketleri pasaporttaki bilgilerle otomatik doldurulur; siz yalnızca eksikleri onaylarsınız.</p></div>';
  h+=R.map(function(r){var on=!!k.shared[r[0]],left=Math.round(r[3]*(100-r[5])/100);return '<div style="border:1px solid #E6DED3;border-radius:12px;padding:18px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between"><div style="flex:1 1 320px;min-width:0"><div style="font-weight:700;font-size:16px">'+r[1]+'</div><div style="font-size:14px;color:#4A3D2F;margin-top:4px">'+r[2]+' · '+r[3]+' soru · son gün '+r[4]+'</div><span class="bar" style="height:8px;margin-top:10px;max-width:420px"><span style="width:'+r[5]+'%"></span></span><div class="small muted" style="margin-top:6px">%'+r[5]+' otomatik dolduruldu · '+left+' soru sizi bekliyor</div></div><div class="pills"><button type="button" class="btn ghost">Taslağı incele</button><button type="button" class="btn" style="'+(on?'background:#0F6B5C':'')+'" aria-pressed="'+on+'" data-a="kshare" data-v="'+r[0]+'">'+(on?'Pasaport paylaşıldı':'Pasaportu paylaş')+'</button></div></div>'}).join('')+'</section>';
 }
 h+='<p class="note">Marka, firma, belge ve rakamlar uydurma örnek veridir; uyum kuralları uzman onayıyla kurulacak.</p></main>';
 return '<div style="--acc:#8A4B0F;background:#F7F4EF;min-height:100vh">'+h+'</div>';
}

function render(){
 document.getElementById('topnav').innerHTML='<span class="brand disp">Örnek prototip</span>'+VIEWS.map(function(x){return '<button type="button" class="navlink" aria-current="'+(S.view===x[0]?'page':'false')+'" data-a="go" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('');
 var f={genel:genel,recetra:recetra,vitrinova:vitrinova,kokpas:kokpas}[S.view];
 document.getElementById('app').innerHTML=f();
}
function setView(v,push){if(!{genel:1,recetra:1,vitrinova:1,kokpas:1}[v])v='genel';S.view=v;if(push&&location.hash!=='#'+v){try{location.hash=v}catch(e){}}render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;var a=t.getAttribute('data-a'),v=t.getAttribute('data-v');
 var r=S.r,vv=S.v,k=S.k;
 switch(a){
  case 'go':setView(v,true);return;
  case 'rtab':r.tab=Number(v);break;
  case 'rcat':r.cat=v;break;case 'rgoal':r.goal=v;break;case 'rcountry':r.country=v;break;
  case 'rpick':r.picked[v]=!r.picked[v];r.sent=false;break;
  case 'rsend':r.sent=Object.keys(r.picked).some(function(x){return r.picked[x]});r.tab=3;break;
  case 'vtab':vv.tab=Number(v);break;case 'vsel':vv.sel=v;break;
  case 'vsend':vv.status[vv.sel]='sent';break;case 'vdecline':vv.status[vv.sel]='declined';break;
  case 'vq':vv.q=Number(v);break;case 'vlang':vv.lang=v==='Türkçe'?'TR':'EN';break;
  case 'ktab':k.tab=Number(v);break;case 'kdone':k.done[v]=!k.done[v];break;
  case 'kfilter':k.filter=v;break;case 'kshare':k.shared[v]=!k.shared[v];break;
  default:return;
 }
 render();
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='pct'){S.r.pct=Number(e.target.value);render();var el=document.getElementById('pct');if(el)el.focus()}});
window.addEventListener('hashchange',function(){setView(location.hash.replace('#',''),false)});
setView((location.hash||'#genel').replace('#',''),false);
})();
</script>
